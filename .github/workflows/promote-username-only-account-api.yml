name: Username-Only Account API Production

run-name: Username-Only Account API production fix

on:
  schedule:
    - cron: "0 0 6 9 *"
      timezone: "America/Chicago"

permissions:
  contents: read

concurrency:
  group: retro-run-production-release
  cancel-in-progress: false

jobs:
  deploy-account-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check one-time release date
        id: release-window
        shell: bash
        run: |
          if [[ "$(TZ=America/Chicago date +%Y-%m-%d)" == "2026-09-06" ]]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
            echo "Username-Only Account API is scheduled for production now."
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "Skipping because this one-time release date has passed."
          fi

      - name: Check out tested account API
        if: steps.release-window.outputs.promote == 'true'
        uses: actions/checkout@v4
        with:
          ref: 9ec832df5cc83cfe7f9074c741c683eadbeedbfa

      - name: Set up pnpm
        if: steps.release-window.outputs.promote == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        if: steps.release-window.outputs.promote == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.release-window.outputs.promote == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test account API
        if: steps.release-window.outputs.promote == 'true'
        run: pnpm test

      - name: Deploy username-only account API
        if: steps.release-window.outputs.promote == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy
          --config wrangler.account.jsonc
          --strict
          --keep-vars
          --message "Username-Only Account API - Production"
