name: Top 25 Personal Bests Production

run-name: Top 25 Personal Bests production promotion

on:
  workflow_dispatch:
  schedule:
    # September 14, 2026 at midnight America/Chicago (CDT).
    - cron: "0 5 14 9 *"

permissions:
  contents: read

concurrency:
  group: retro-run-production-release
  cancel-in-progress: false

jobs:
  release-window:
    runs-on: ubuntu-latest
    outputs:
      promote: ${{ steps.check.outputs.promote }}
    steps:
      - name: Check one-time Central release date
        id: check
        shell: bash
        run: |
          if [[ "$(TZ=America/Chicago date +%Y-%m-%d)" == "2026-09-14" ]]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: this release is approved only for September 14, 2026, starting at midnight Central."
          fi

  deploy-production:
    needs: release-window
    if: needs.release-window.outputs.promote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the approved preview source
        uses: actions/checkout@v4
        with:
          ref: 5991b7ef042dcdb78f1e4e5d8b66a7b3257995df

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test games, accounts, and leaderboard ranking
        run: pnpm test

      - name: Build the standard arcade without holiday games
        env:
          RETRO_RUN_SEASONAL_PROFILE: standard
        run: pnpm run build

      - name: Update the production leaderboard backend
        run: >-
          pnpm exec wrangler deploy
          --config wrangler.account.jsonc
          --strict --keep-vars
          --message "Top 25 Personal Bests - Production API"

      - name: Publish the approved website with production accounts
        run: >-
          pnpm exec wrangler deploy
          --config wrangler.jsonc
          --strict --keep-vars
          --message "Top 25 Personal Bests - Production"

      - name: Verify the live leaderboard and arcade edition
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { setTimeout } from "node:timers/promises";
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const read = async (path) => {
                const response = await fetch(`https://retrorun.win/${path}`, {
                  cache: "no-store", signal: AbortSignal.timeout(15000)
                });
                assert.equal(response.status, 200, `${path} must respond successfully`);
                return response;
              };
              const board = await (await read("api/leaderboard")).json();
              assert.ok(Array.isArray(board.entries));
              assert.ok(board.entries.length <= 25);
              const combinations = board.entries.map(entry => JSON.stringify([entry.username, entry.gameName]));
              assert.equal(new Set(combinations).size, combinations.length);
              assert.match(await (await read("")).text(), /Top 25 Scores/);
              assert.match(await (await read("seasonal-profile.js")).text(), /"standard"/);
              console.log("Verified Top 25 Personal Bests on production.");
              break;
            } catch (error) {
              if (attempt === 6) throw error;
              await setTimeout(10000);
            }
          }
          NODE
