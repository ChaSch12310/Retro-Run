name: Admin Report Center Production

run-name: Admin Report Center production promotion

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retro-run-production-release
  cancel-in-progress: false

jobs:
  release-window:
    runs-on: ubuntu-latest
    outputs:
      promote: ${{ steps.check.outputs.promote }}
    steps:
      - name: Approve manual production rerun
        id: check
        shell: bash
        run: |
          echo "promote=true" >> "$GITHUB_OUTPUT"
          echo "Admin Report Center manual production rerun approved."

  deploy-production:
    needs: release-window
    if: needs.release-window.outputs.promote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the approved preview source
        uses: actions/checkout@v4
        with:
          ref: a9a8f195fd72f0817c72350c3b3cbcffb49abf51

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the approved release
        run: pnpm test

      - name: Build the standard arcade without holiday games
        env:
          RETRO_RUN_SEASONAL_PROFILE: standard
        run: pnpm run build

      - name: Update the production account and moderation backend
        run: >-
          pnpm exec wrangler deploy
          --config wrangler.account.jsonc
          --strict --keep-vars
          --message "Admin Report Center - Production API"

      - name: Publish the approved website with production accounts
        run: >-
          pnpm exec wrangler deploy
          --config wrangler.jsonc
          --strict --keep-vars
          --message "Admin Report Center - Production"

      - name: Verify the production release
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { setTimeout } from "node:timers/promises";
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const read = async (path, options = {}) => fetch(`https://retrorun.win/${path}`, {
                cache: "no-store",
                signal: AbortSignal.timeout(15000),
                ...options,
              });
              const health = await read("api/health");
              assert.equal(health.status, 200);
              const home = await read("");
              assert.equal(home.status, 200);
              assert.match(await home.text(), /report-control-center/);
              const moderation = await read("admin?report=12345678-1234-1234-1234-123456789abc");
              assert.equal(moderation.status, 200);
              assert.match(await moderation.text(), /Report Control Center/);
              const legacyModeration = await read("moderate.html?report=12345678-1234-1234-1234-123456789abc", {
                redirect: "manual",
              });
              assert.equal(legacyModeration.status, 308);
              assert.match(legacyModeration.headers.get("location") || "", /\/admin\?report=/);
              const readOnlyReport = await read("api/moderation/report", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Origin: "https://retrorun.win",
                },
                body: JSON.stringify({
                  reportId: "12345678-1234-1234-1234-123456789abc",
                }),
              });
              assert.equal(readOnlyReport.status, 404);
              const protectedAction = await read("api/moderation/action", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Origin: "https://retrorun.win",
                },
                body: JSON.stringify({
                  reportId: "12345678-1234-1234-1234-123456789abc",
                  password: "release-verification-wrong-password",
                  action: "ban-account",
                }),
              });
              assert.equal(protectedAction.status, 401);
              assert.match(await (await read("seasonal-profile.js")).text(), /"standard"/);
              console.log("Verified Admin Report Center on production.");
              break;
            } catch (error) {
              if (attempt === 6) throw error;
              await setTimeout(10000);
            }
          }
          NODE
