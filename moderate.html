<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Report Control Center | Retro Run</title>
    <link rel="icon" href="assets/retro-run-icon-transparent.png" type="image/png" />
    <link rel="stylesheet" href="styles.css?v=20261024-read-only-inbox" />
  </head>
  <body class="moderation-page">
    <main class="moderation-shell">
      <a class="moderation-home-link" href="/" aria-label="Return to Retro Run">Retro Run</a>
      <section class="moderation-card" aria-labelledby="moderationTitle">
        <header class="moderation-header">
          <div>
            <span class="eyebrow">Creator Access</span>
            <h1 id="moderationTitle">Report Control Center</h1>
          </div>
          <span class="moderation-lock" aria-hidden="true">Review Mode</span>
        </header>

        <p id="moderationStatus" class="moderation-status" role="status">
          Loading current and previous reports...
        </p>

        <section id="moderationInbox" class="moderation-inbox" hidden>
          <div class="moderation-inbox-heading">
            <div>
              <span class="eyebrow">Stored Reports</span>
              <h2>Report Inbox</h2>
            </div>
            <strong id="moderationInboxCount">0 reports</strong>
          </div>
          <div id="moderationInboxList" class="moderation-inbox-list"></div>
        </section>

        <section id="moderationReport" class="moderation-report" hidden>
          <button id="moderationBackButton" class="secondary-button moderation-back-button" type="button">
            Back to Inbox
          </button>
          <div class="moderation-report-heading">
            <div>
              <span id="moderationType" class="eyebrow"></span>
              <h2 id="moderationReportId">Report</h2>
            </div>
            <time id="moderationDate"></time>
          </div>
          <dl id="moderationDetails" class="moderation-details"></dl>
          <div id="moderationActions" class="moderation-actions" hidden>
            <button id="moderationRemoveButton" class="secondary-button danger-button" type="button">
              Take Down Post
            </button>
            <button id="moderationBanButton" class="primary-button danger-button" type="button">
              Ban Account
            </button>
          </div>
        </section>
      </section>
    </main>
    <script src="moderation.js?v=20261024-read-only-inbox"></script>
  </body>
</html>
